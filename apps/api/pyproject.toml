[project]
name = "torii-api"
version = "0.1.0"
description = "Torii control plane — SPEC-0001 / SPEC-0002"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.53.0",
  "httpx==0.28.1",
  "cryptography==50.0.1",
  "PyJWT[crypto]==2.14.0",
  "rfc8785==0.1.4",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
  "mypy==2.3.1",
  "types-jsonschema==4.26.0.20260518",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torii_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: isolated PostgreSQL / OIDC dependency required"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["torii_api"]
branch = true

[tool.coverage.report]
show_missing = true
