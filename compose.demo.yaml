name: torii

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow-local-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - torii-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - torii-minio:/data

  create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      TORII_DATA_BUCKET: ${TORII_DATA_BUCKET:-automl-data}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >-
      /bin/sh -c 'until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
      mc mb --ignore-existing local/mlflow;
      mc mb --ignore-existing "local/$${TORII_DATA_BUCKET}"'

  mlflow:
    build:
      context: ./mlflow
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    command:
      - server
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=localhost:*,127.0.0.1:*,mlflow:*
      - --backend-store-uri=postgresql://mlflow:${MLFLOW_DB_PASSWORD:-mlflow-local-dev}@postgres:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination=s3://mlflow
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  workspace:
    image: torii/workspace:py3.12-automl-tabular
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: "3.12"
        PROFILE: automl-tabular
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      DATAHUB_GMS_URL: http://datahub-gms:8080
      DATAHUB_TELEMETRY_ENABLED: "false"
      TORII_DATA_BUCKET: ${TORII_DATA_BUCKET:-automl-data}
      AUTOML_DATA_BUCKET: ${TORII_DATA_BUCKET:-automl-data}
      FRAME_ML_DATA_BUCKET: ${TORII_DATA_BUCKET:-automl-data}
      TORII_EXPERIMENT_NAME: ${TORII_EXPERIMENT_NAME:-automl-end-to-end-mvp}
      TORII_DEMO_EXPERIMENT_NAME: ${TORII_DEMO_EXPERIMENT_NAME:-automl-demo}
      TORII_REGISTERED_MODEL_NAME: ${TORII_REGISTERED_MODEL_NAME:-automl-breast-cancer-classifier}
      FRAME_ML_PROFILE: automl-tabular
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      PYTHONPATH: /workspace/src
      S3_ENDPOINT_URL: http://minio:9000
      SCAFFOLD_VERSION: "3"
      WORKSPACE_IDE: ${WORKSPACE_IDE:-jupyter}
      WORKSPACE_AUTH_MODE: ${WORKSPACE_AUTH_MODE:-token}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-torii-local-dev}
      PASSWORD: ${PASSWORD:-torii-local-dev}
    ports:
      - "8888:8888"
    volumes:
      - torii-workspace:/workspace

  # DataHub's local quickstart backend. These supporting services are kept on
  # the Compose network and are intentionally not exposed on the host.
  mysql:
    image: mysql:8.2
    hostname: mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: datahub
      MYSQL_PASSWORD: datahub
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: datahub
      MYSQL_USER: datahub
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h mysql -u $$MYSQL_USER --password=$$MYSQL_PASSWORD"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: on-failure
    volumes:
      - torii-datahub-mysql:/var/lib/mysql

  search:
    image: opensearchproject/opensearch:2.19.3
    hostname: search
    environment:
      DISABLE_SECURITY_PLUGIN: "true"
      ES_JAVA_OPTS: -Xms256m -Xmx512m -Dlog4j2.formatMsgNoLookups=true
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx1024m -Dlog4j2.formatMsgNoLookups=true
      discovery.type: single-node
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://search:9200/_cluster/health?wait_for_status=yellow&timeout=0s"]
      interval: 5s
      timeout: 15s
      retries: 12
      start_period: 60s
    volumes:
      - torii-datahub-opensearch:/usr/share/opensearch/data

  broker:
    image: confluentinc/cp-kafka:8.2.2
    hostname: broker
    command:
      - /bin/bash
      - -c
      - |
        file_path="/var/lib/kafka/data/clusterID"
        if [ ! -f "$$file_path" ]; then
          /bin/kafka-storage random-uuid > "$$file_path"
          kafka-storage format --ignore-formatted -t $$(cat "$$file_path") -c /etc/kafka/kafka.properties
        fi
        export CLUSTER_ID=$$(cat "$$file_path")
        /etc/confluent/docker/run
    environment:
      KAFKA_ADVERTISED_LISTENERS: BROKER://broker:29092
      KAFKA_BROKER_ID: "1"
      KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:39092
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT
      KAFKA_LISTENERS: BROKER://broker:29092,CONTROLLER://broker:39092
      KAFKA_LOG4J_LOGGERS: org.apache.kafka.image.loader.MetadataLoader=WARN
      KAFKA_MAX_MESSAGE_BYTES: "5242880"
      KAFKA_MESSAGE_MAX_BYTES: "5242880"
      KAFKA_NODE_ID: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_PROCESS_ROLES: controller,broker
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server broker:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 60s
    volumes:
      - torii-datahub-kafka:/var/lib/kafka/data

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.2
    hostname: schema-registry
    depends_on:
      broker:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://schema-registry:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

  datahub-system-update:
    image: acryldata/datahub-upgrade:${DATAHUB_VERSION:-v1.7.0}
    hostname: datahub-system-update
    command: ["-u", "SystemUpdate"]
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      mysql:
        condition: service_healthy
      search:
        condition: service_healthy
    environment: &datahub-backend-environment
      DATAHUB_BASE_PATH: /
      DATAHUB_GMS_BASE_PATH: /
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_PRECREATE_TOPICS: "true"
      DATAHUB_SQL_SETUP_ENABLED: "true"
      DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SERVICE_SALT:-automl-local-datahub-salt}
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver
      EBEAN_DATASOURCE_HOST: mysql:3306
      EBEAN_DATASOURCE_PASSWORD: datahub
      EBEAN_DATASOURCE_URL: jdbc:mysql://mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2
      EBEAN_DATASOURCE_USERNAME: root
      ELASTICSEARCH_HOST: search
      ELASTICSEARCH_IMPLEMENTATION: opensearch
      ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: "true"
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      ENTITY_VERSIONING_ENABLED: "true"
      GRAPH_SERVICE_IMPL: elasticsearch
      KAFKA_BOOTSTRAP_SERVER: broker:29092
      KAFKA_SCHEMAREGISTRY_URL: http://schema-registry:8081
      PARTITIONS: "3"
      SCHEMA_REGISTRY_SYSTEM_UPDATE: "true"
      SCHEMA_REGISTRY_TYPE: KAFKA
      SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS: "true"
      SPRING_KAFKA_PROPERTIES_USE_LATEST_VERSION: "true"
      USE_CONFLUENT_SCHEMA_REGISTRY: "true"

  datahub-gms:
    image: acryldata/datahub-gms:${DATAHUB_VERSION:-v1.7.0}
    hostname: datahub-gms
    depends_on:
      datahub-system-update:
        condition: service_completed_successfully
    environment:
      <<: *datahub-backend-environment
      ALTERNATE_MCP_VALIDATION: "true"
      CONFIG_ENTITY_REGISTRY_USE_OPTIMIZED_LOADING: "true"
      DATAHUB_OBJECT_STORAGE_URI: file:///tmp/datahub-object-storage
      DATAHUB_SERVER_TYPE: quickstart
      DATAHUB_TELEMETRY_ENABLED: "false"
      ELASTICSEARCH_LIMIT_RESULTS_STRICT: "true"
      ENTITY_SERVICE_ENABLE_RETENTION: "true"
      ES_BULK_REFRESH_POLICY: NONE
      GRAPH_SERVICE_DIFF_MODE_ENABLED: "true"
      JAVA_OPTS: -Xms1g -Xmx1g
      MAE_CONSUMER_ENABLED: "true"
      MCE_CONSUMER_ENABLED: "true"
      MCL_CONSUMER_BATCH_ENABLED: "true"
      MCP_CONSUMER_BATCH_ENABLED: "true"
      METADATA_SERVICE_AUTH_ENABLED: "false"
      PE_CONSUMER_ENABLED: "true"
      SCHEMA_REGISTRY_TYPE: KAFKA
      SHOW_HOME_PAGE_REDESIGN: "true"
      SHOW_INGESTION_PAGE_REDESIGN: "true"
      STRICT_URN_VALIDATION_ENABLED: "true"
      THEME_V2_DEFAULT: "true"
      UI_INGESTION_ENABLED: "true"
      UI_INGESTION_DEFAULT_CLI_VERSION: "1.7.0"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://datahub-gms:8080/health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 90s

  datahub-frontend:
    image: acryldata/datahub-frontend-react:${DATAHUB_VERSION:-v1.7.0}
    hostname: datahub-frontend-react
    depends_on:
      datahub-gms:
        condition: service_healthy
    environment:
      DATAHUB_APP_VERSION: ${DATAHUB_VERSION:-v1.7.0}
      DATAHUB_BASE_PATH: /
      DATAHUB_GMS_BASE_PATH: /
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_PLAY_MEM_BUFFER_SIZE: 10MB
      DATAHUB_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATAHUB_TRACKING_TOPIC: DataHubUsageEvent_v1
      FRONTEND_GRACEFUL_SHUTDOWN_ENABLED: "false"
      JAVA_OPTS: -Xms512m -Xmx512m -Dhttp.port=9002 -Dconfig.file=datahub-frontend/conf/application.conf -Djava.security.auth.login.config=datahub-frontend/conf/jaas.conf -Dlogback.configurationFile=datahub-frontend/conf/logback.xml -Dpidfile.path=/dev/null
      KAFKA_BOOTSTRAP_SERVER: broker:29092
      PLAY_HTTP_CONTEXT: /
      THEME_V2_DEFAULT: "true"
    ports:
      - "9002:9002"

volumes:
  torii-postgres:
  torii-minio:
  torii-workspace:
  torii-datahub-kafka:
  torii-datahub-mysql:
  torii-datahub-opensearch:
